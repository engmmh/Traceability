<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام أفق الحروف - تفتيش الفروع</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;color:#17202a}.wrap{max-width:1250px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #00000008}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #cbd5e1;font-size:15px}button{cursor:pointer;background:#17202a;color:#fff;border:0}.secondary{background:#64748b}.danger{background:#b91c1c}.ok{background:#166534}.muted{color:#64748b}.hidden{display:none}.result{white-space:pre-wrap;background:#f8fafc;border-radius:10px;padding:12px;margin-top:10px}.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.formbox{border:1px solid #dbe2ea;border-radius:12px;padding:14px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;margin:2px;font-size:12px}.tablewrap{overflow:auto}.check{font-weight:bold;font-size:20px;color:#166534}.bad{color:#b91c1c}.footer{text-align:center;color:#64748b;font-size:13px;margin:25px}
</style>
</head>
<body><div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:70px auto"><h1>نظام تفتيش الفروع</h1><p class="muted">شركة آفق الحروف التجارية UFUQ</p><input id="password" type="password" placeholder="الرقم السري"><br><br><button onclick="login()">دخول</button><div id="loginMsg" class="result hidden"></div></div>
<div id="app" class="hidden">
<div class="card"><h1>لوحة التحكم</h1><div class="grid"><div><label>تاريخ التشغيل</label><input id="runDate" type="date"></div><div><label>&nbsp;</label><button onclick="saveDate()">تحديث التاريخ</button></div><div><label>&nbsp;</label><button class="danger" onclick="resetDay()">مسح علامات ✓ لليوم</button></div></div><div id="dateMsg" class="result"></div></div>
<div class="card"><h2>رفع فواتير PDF</h2><input id="pdfs" type="file" accept="application/pdf" multiple><br><br><button class="ok" onclick="uploadPDFs()">معالجة الفواتير</button><div id="uploadMsg" class="result"></div></div>
<div class="card"><h2>تحديث تواريخ مجموعة</h2><div class="grid"><select id="groupSelect"></select><input id="groupProd" type="date"><input id="groupExp" type="date"><input id="groupNote" placeholder="ملاحظة"><button onclick="saveGroupDates()">تطبيق على المجموعة</button></div></div>
<div class="card"><h2>تحديث منتج منفرد</h2><div class="grid"><select id="productSelect"></select><input id="prodProd" type="date"><input id="prodExp" type="date"><input id="prodNote" placeholder="ملاحظة"><button onclick="saveProductDate()">حفظ المنتج</button></div></div>
<div class="card"><h2>المنتجات والمجموعات</h2><div class="grid"><input id="newGroup" placeholder="اسم المجموعة"><input id="newProductCode" placeholder="كود المنتج"><input id="newProductName" placeholder="اسم المنتج"><select id="newProductGroup"></select><button onclick="addGroup()">إضافة مجموعة</button><button onclick="addProduct()">إضافة منتج</button></div></div>
<div class="card"><h2>النماذج الـ12</h2><div id="forms" class="forms"></div></div>
<div class="footer">© 2026 شركة آفق الحروف التجارية UFUQ | جميع الحقوق محفوظة<br>Prepared by: Eng. Mahmoud Hegazi</div>
</div></div>
<script>
let token='', data={branches:[],forms:[],groups:[],products:[]};
const $=id=>document.getElementById(id); const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j.message||'حدث خطأ');return j};
function msg(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const j=await r.json();if(!r.ok)throw new Error(j.message);token=j.token;localStorage.setItem('ufuqToken',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('runDate').value=new Date().toISOString().slice(0,10);await boot()}catch(e){msg('loginMsg',e.message)}}
async function boot(){data=await api('/api/bootstrap');fillSelect('groupSelect',data.groups,'id','name','اختر المجموعة');fillSelect('newProductGroup',data.groups,'id','name','بدون مجموعة');fillSelect('productSelect',data.products,'id','name','اختر المنتج');$('forms').innerHTML=data.forms.map(f=>`<div class="formbox"><h3>النموذج ${f.form_no}</h3><div>${(f.form_branches||[]).map(x=>`<span class="pill">${x.branches.code} - ${x.branches.name}</span>`).join('')||'<span class="muted">لم يتم ربط الفروع بعد</span>'}</div><br><button onclick="openForm(${f.id})">عرض النموذج</button></div>`).join('')}
function fillSelect(id,arr,val,text,first){$(id).innerHTML=`<option value="">${first}</option>`+arr.map(x=>`<option value="${x[val]}">${x[text]}</option>`).join('')}
async function saveDate(){try{const j=await api('/api/date',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('runDate').value})});msg('dateMsg','تم ضبط التاريخ: '+j.display)}catch(e){msg('dateMsg',e.message)}}
async function uploadPDFs(){try{const fs=$('pdfs').files;if(!fs.length)return msg('uploadMsg','اختر ملفات PDF أولًا.');const fd=new FormData();fd.append('date',$('runDate').value);[...fs].forEach(f=>fd.append('files',f));const j=await api('/api/invoices',{method:'POST',body:fd});msg('uploadMsg',j.results.map(r=>`${r.success?'✅':'❌'} ${r.file}\nالفرع: ${r.branch||'غير محدد'}\nالمطابق: ${r.matchedCodes?.join(', ')||'لا يوجد'}\nالأكواد غير الموجودة في قاعدة المنتجات: ${r.unknownCodes?.join(', ')||'لا يوجد'}\n`).join('\n'));}catch(e){msg('uploadMsg',e.message)}}
async function resetDay(){if(!confirm('سيتم حذف علامات ✓ لليوم فقط. هل تريد المتابعة؟'))return;try{const j=await api('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('runDate').value})});alert(j.message)}catch(e){alert(e.message)}}
async function saveGroupDates(){try{const j=await api('/api/dates/group',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_id:$('groupSelect').value,production_date:$('groupProd').value,expiry_date:$('groupExp').value,notes:$('groupNote').value})});alert(`تم تحديث ${j.updated} منتج.`)}catch(e){alert(e.message)}}
async function saveProductDate(){try{await api('/api/dates/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:$('productSelect').value,production_date:$('prodProd').value,expiry_date:$('prodExp').value,notes:$('prodNote').value})});alert('تم حفظ بيانات المنتج.')}catch(e){alert(e.message)}}
async function addGroup(){try{const j=await api('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('newGroup').value})});alert('تمت إضافة المجموعة: '+j.group.name);await boot()}catch(e){alert(e.message)}}
async function addProduct(){try{const j=await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('newProductCode').value,name:$('newProductName').value,group_id:$('newProductGroup').value||null})});alert('تمت إضافة المنتج: '+j.product.name);await boot()}catch(e){alert(e.message)}}
async function openForm(id){try{const j=await api(`/api/forms/${id}?date=${encodeURIComponent($('runDate').value)}`);let h=`<h2>${j.form.name}</h2><div class="tablewrap"><table border="1" cellpadding="8" cellspacing="0" width="100%"><tr><th>#</th><th>المنتج</th>${j.form.form_branches.map(b=>`<th>${b.branches.code}</th>`).join('')}<th>الإنتاج</th><th>الانتهاء</th></tr>`;for(const p of j.products)h+=`<tr><td>${p.row_order}</td><td>${p.name}<br><small>${p.code}</small></td>${j.form.form_branches.map(b=>`<td class="check">${p.checks[b.branch_id]?'✓':''}</td>`).join('')}<td>${p.product_dates?.[0]?.production_date||''}</td><td>${p.product_dates?.[0]?.expiry_date||''}</td></tr>`;h+='</table></div><br><button onclick="window.print()">طباعة</button>';const w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><title>${j.form.name}</title><style>body{font-family:Arial;padding:20px}table{border-collapse:collapse}th{background:#eee}</style></head><body>${h}</body></html>`);w.document.close()}catch(e){alert(e.message)}}
const saved=localStorage.getItem('ufuqToken');if(saved){token=saved;document.addEventListener('DOMContentLoaded',async()=>{try{$('login').classList.add('hidden');$('app').classList.remove('hidden');$('runDate').value=new Date().toISOString().slice(0,10);await boot()}catch{localStorage.removeItem('ufuqToken')}})}
</script></body></html>
